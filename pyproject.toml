[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pep8-scanner"
version = "0.1.0"
description = "Scanner de conformité PEP8/PEP257, 100% local"
requires-python = ">=3.6"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
